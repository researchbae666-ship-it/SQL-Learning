name: Archive publisher SQL textbook PDF

on:
  push:
    paths:
      - .github/workflows/archive-source-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify publisher edition (not chat-upload identical)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Source
          curl --fail --location --retry 3 --max-time 90 \
            'https://riptutorial.com/Download/sql.pdf' -o Source/SQL-Textbook-Publisher.pdf
          echo 'fe61329302b9202ada35698e2599df57eb8158120240901b72fec4200fd4f500  Source/SQL-Textbook-Publisher.pdf' | sha256sum --check
          file Source/SQL-Textbook-Publisher.pdf
          cat > Source/README.md <<'EOF'
          # SQL textbook source PDFs

          - [SQL-Textbook-Publisher.pdf](SQL-Textbook-Publisher.pdf): Complete, 221-page PDF fetched from https://riptutorial.com/Download/sql.pdf on 2026-10-13. SHA-256: `fe61329302b9202ada35698e2599df57eb8158120240901b72fec4200fd4f500`.
          - The **original uploaded PDF** in the ChatGPT conversation had a different SHA-256: `1640f9cdc53b66c4b6d84231f78787d2bb28f2e2b7e811945ff549da27c60366`, size 956,740 bytes, 221 pages.
          - This publisher PDF provides the whole book, but **is not a byte-for-byte copy of the chat attachment**. Do not misrepresent it as the original upload.
          - Original ebook credits and CC BY-SA attribution are in the PDF.
          EOF
      - name: Commit publisher edition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/SQL-Textbook-Publisher.pdf Source/README.md
          if ! git diff --staged --quiet; then
            git commit -m "Archive full publisher edition of 221-page SQL textbook"
            git pull --rebase origin main
            git push
          fi
